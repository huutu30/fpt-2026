<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPT Telecom - Lắp mạng Internet cáp quang, Truyền hình & Camera</title>
  <meta name="description"
    content="Đăng ký lắp đặt mạng Internet cáp quang, Truyền hình FPT Play, Camera an ninh và thiết bị Smart Home từ FPT Telecom. Đường truyền tốc độ cao, hỗ trợ 24/7." />
  <meta name="keywords" content="FPT Telecom, Lắp mạng FPT, Internet FPT, Truyền hình FPT, FPT Camera, Lắp wifi FPT" />
  <meta name="robots" content="index, follow" />


  <!-- LCP Preload: Tối ưu tải ảnh banner đầu tiên -->
  <link rel="preload" as="image" href="/images/optimized/banner_1.webp" fetchpriority="high">
  <link rel="preconnect" href="https://hi-static.fpt.vn" crossorigin="anonymous">
  <link rel="preconnect" href="https://portal-sop.fpt.vn" crossorigin>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    !(function () {
      if (document.getElementById("livechat-sop")) return;

      // 1. Nhúng CSS của Livechat SOP
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "https://portal-sop.fpt.vn/livechat-service/widget.css";
      document.head.appendChild(link);

      // 2. Tạo container cho Livechat
      const chatContainer = document.createElement("div");
      chatContainer.id = "livechat-sop";
      document.body.appendChild(chatContainer);

      // 3. Thiết lập sop_id an toàn (tránh lỗi Safari Incognito / Storage disabled)
      try {
        localStorage.setItem("sop_id", "3867");
      } catch (err) {
        console.warn("Không thể lưu sop_id vào localStorage:", err);
      }

      // 4. Nhúng script Widget.js
      const script = document.createElement("script");
      script.type = "module";
      script.crossOrigin = "";
      script.src = "https://portal-sop.fpt.vn/livechat-service/Widget.js";
      document.body.appendChild(script);
    })();
  </script>
</body>

</html>
